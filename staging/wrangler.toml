# Sitio de PRUEBA (prueba.quieromisfotos.com.ar): archivos estáticos del frontend, misma API y mismos datos que el oficial.
# Publicar: tools/deploy-prueba.sh   (el oficial sigue siendo GitHub Pages desde main)
name = "qmf-prueba"
