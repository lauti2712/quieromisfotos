<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiero Mis Fotos</title>
<meta name="robots" content="noindex">
<script>
  // Páginas de evento / fotógrafo que todavía no se generaron (se generan cada hora): mandar a la app.
  (function () {
    var p = location.pathname, q = new URLSearchParams(location.search), f = q.get('f');
    var m = p.match(/^\/e\/([A-Za-z0-9_-]+)\/?$/), n = p.match(/^\/f\/([a-z0-9-]+)\/?$/), a = p.match(/^\/([a-z0-9][a-z0-9-]{2,39})\/?$/);
    q.delete('s');
    if (m) location.replace('/#/evento/' + m[1] + (q.toString() ? '?' + q.toString() : ''));
    else if (n) location.replace('/#/f/' + n[1]);
    else if (a) {
      // Link corto de un fotógrafo (quieromisfotos.com.ar/torneo-apertura) -> su álbum en el evento.
      fetch('https://firestore.googleapis.com/v1/projects/quieromisfotos-71629/databases/(default)/documents/aliases/' + a[1] + '?key=AIzaSyD8-421zYevgPvfuS9mvF_6LYE3GdALzLA')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var f = d && d.fields;
          if (f && f.eventId) location.replace('/#/evento/' + f.eventId.stringValue + '?f=' + encodeURIComponent(f.uid.stringValue));
          else location.replace('/');
        })
        .catch(function () { location.replace('/'); });
    }
    else location.replace('/');
  })();
</script>
</head>
<body style="font-family:system-ui;background:#0f1115;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0">
  <p>Redirigiendo… <a href="/" style="color:#ff5a1f">Ir a Quiero Mis Fotos</a></p>
</body>
</html>
