name = "qmf-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "qmf-api.solucionescotidianas.com.ar", custom_domain = true },
  { pattern = "api.quieromisfotos.com.ar", custom_domain = true },
  # Webs de los fotógrafos: {slug}.quieromisfotos.com.ar (DNS: AAAA * 100:: con proxy)
  { pattern = "*.quieromisfotos.com.ar/*", zone_name = "quieromisfotos.com.ar" },
]

[vars]
API_URL = "https://api.quieromisfotos.com.ar"
SITE_URL = "https://quieromisfotos.com.ar/"
PANEL_URL = "https://quieromisfotos.com.ar/panel.html"
FIREBASE_PROJECT_ID = "quieromisfotos-71629"
ALLOWED_ORIGINS = "https://quieromisfotos.com.ar,https://solucionescotidianas.com.ar,https://www.quieromisfotos.com.ar,http://localhost:5175"
# Dominio público del bucket qmf-public (custom domain de R2). Si está vacío, el Worker sirve /public/*.
PUBLIC_BASE_URL = "https://qmf-fotos.solucionescotidianas.com.ar"
# Mercado Pago (aplicación "Quiero Mis Fotos", modo marketplace)
MP_CLIENT_ID = "7944412158224473"
MP_REDIRECT_URI = "https://qmf-api.solucionescotidianas.com.ar/mp/callback"
# "1" para probar con cuentas de prueba de MP (no manda el email del comprador). Vacío = producción.
MP_TEST_MODE = ""
# "1" = no pedir a MP que retenga la comisión (solo para pruebas con vendedor de prueba). Vacío = producción.
MP_TEST_NO_FEE = ""

[[r2_buckets]]
binding = "PUBLIC"
bucket_name = "qmf-public"

[[r2_buckets]]
binding = "PRIVATE"
bucket_name = "qmf-private"

# Secretos (wrangler secret put):
#   UPLOAD_SECRET     -> HMAC para tokens de subida
#   MP_CLIENT_SECRET  -> secreto de la aplicación de MP (OAuth)
#   MP_ACCESS_TOKEN   -> access token de la plataforma (cobro de extensiones y Pro)
